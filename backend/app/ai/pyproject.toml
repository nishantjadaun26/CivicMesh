[project]
name = "civicmesh-ai"
version = "0.1.0"
description = "CivicMesh multimodal reporting, complaint drafting and follow-up AI workflows"
requires-python = ">=3.11,<3.14"
dependencies = ["google-genai==1.75.0", "langgraph==1.2.19", "pydantic==2.14.2", "httpx==0.28.1"]

[project.optional-dependencies]
checkpoints = ["langgraph-checkpoint-postgres==3.2.0", "langgraph-checkpoint-sqlite==3.1.3"]

[project.scripts]
civicmesh-extract = "civicmesh_ai.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["civicmesh_ai", "civicmesh_ai.graph", "civicmesh_ai.nodes", "civicmesh_ai.providers", "civicmesh_ai.tools", "civicmesh_ai.prompts"]
package-dir = {"civicmesh_ai" = "."}

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

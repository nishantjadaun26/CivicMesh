[project]
name = "civicmesh-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0", "uvicorn[standard]==0.54.0", "pydantic==2.14.2",
  "pydantic-settings==2.16.2", "sqlalchemy==2.1.6", "psycopg[binary]==3.3.6",
  "geoalchemy2==0.20.0", "pgvector==0.5.1", "langgraph==1.2.19",
  "google-genai==1.75.0", "httpx==0.28.1", "beautifulsoup4==4.15.0", "pymupdf==1.28.2"
]
[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "jsonschema==4.26.0", "pyyaml==6.0.3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

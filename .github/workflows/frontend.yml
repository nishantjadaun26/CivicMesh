name: Frontend module checks
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'contracts/**', '.github/workflows/frontend.yml']
  push:
    branches: [feat/frontend, feat/project-integration]
    paths: ['frontend/**', 'backend/**', 'contracts/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check generated API types
        run: |
          npm run api:generate
          git diff --exit-code src/types/api.generated.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.11'
      - run: uv sync --project ../backend --frozen --extra dev
      - run: ../backend/.venv/bin/python ../scripts/check_public_bundle.py
      - run: npm run test:integration
      - run: npm audit --audit-level=moderate

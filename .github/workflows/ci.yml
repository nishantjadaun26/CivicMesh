name: Foundation checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/frontend, feat/ai-workflow, feat/backend]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.15'
          python-version: '3.11'
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen ruff check --config pyproject.toml app tests ../scripts
        working-directory: backend
      - run: uv run --frozen pytest
        working-directory: backend
      - run: uv run --frozen python ../scripts/export_openapi.py --check
        working-directory: backend
      - run: uv run --frozen python ../scripts/export_migration.py --check
        working-directory: backend
      - run: curl --fail --location https://coderabbit.ai/integrations/schema.v2.json --output /tmp/coderabbit-schema.json
      - run: uv run --frozen python ../scripts/validate_coderabbit.py /tmp/coderabbit-schema.json
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:types
      - run: git diff --exit-code -- src/types/api.generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
